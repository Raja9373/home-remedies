  <style>
    :root {
      --primary-green: #1A7A4C;
      --primary-green-hover: #14633D;
      --vibrant-mint: #2BB673;
      --vibrant-teal: #00C9A7;
      --light-green-bg: #E8F5EE;
      --pure-white: #FFFFFF;
      --soft-cream: #FAF8F3;
      --warning-yellow: #FFF8E1;
      --warning-border: #F2DF9F;
      --danger-red: #B91C1C;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --text-dark: #1A1A1A;
      --text-grey: #555E5A;
      --border-subtle: rgba(26, 122, 76, 0.12);
      --footer-dark: #0F3D26;
      --radius-card: 20px;
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.10);
      --shadow-card-hover: 0 18px 38px rgba(26, 122, 76, 0.18);
      --shadow-btn-3d: 0 6px 16px rgba(15, 61, 38, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-body);
      background-color: #F4FBF7;
      background-image:
        radial-gradient(circle at 8% 18%, rgba(43, 182, 115, 0.14) 0%, rgba(232, 245, 238, 0.72) 24%, transparent 48%),
        radial-gradient(circle at 92% 35%, rgba(0, 201, 167, 0.12) 0%, rgba(232, 245, 238, 0.55) 22%, transparent 46%),
        radial-gradient(circle at 20% 82%, rgba(232, 245, 238, 0.9) 0%, transparent 44%);
      color: var(--text-dark);
      line-height: 1.6;
      font-size: 16px;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      letter-spacing: -0.02em;
    }

    button, input, select {
      font-family: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--primary-green);
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    /* TOP BAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(26, 122, 76, 0.12);
      box-shadow: 0 4px 18px rgba(15, 61, 38, 0.06);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 70px;
      padding-top: 10px;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-dark);
      flex-shrink: 0;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1A7A4C, #2BB673);
      color: var(--pure-white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(26, 122, 76, 0.25);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark);
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary-green);
      white-space: nowrap;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-link {
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-grey);
      white-space: nowrap;
      padding: 6px 4px;
    }

    .nav-link:hover {
      color: var(--primary-green);
      text-decoration: underline;
    }

    .share-print-bar {
      margin-top: 26px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .print-btn {
      background: linear-gradient(180deg, #FFFFFF 0%, #F1F8F4 100%);
      color: var(--text-dark);
      border: 1.5px solid rgba(26, 122, 76, 0.28);
      border-radius: 999px;
      padding: 12px 24px;
      min-height: 44px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      transition: transform 140ms ease, border-color 160ms ease, color 160ms ease;
    }

    .print-btn:hover {
      border-color: var(--primary-green);
      color: var(--primary-green);
      transform: translateY(-2px);
    }

    .print-btn:active {
      transform: translateY(2px);
    }

    .whatsapp-btn {
      background: linear-gradient(135deg, #1A7A4C, #2BB673);
      color: var(--pure-white);
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      min-height: 44px;
      font-size: 0.92rem;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-btn-3d);
      transition: transform 140ms ease, filter 160ms ease;
    }

    .whatsapp-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }

    .whatsapp-btn:active {
      transform: translateY(2px);
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-link {
      background: none;
      border: none;
      padding: 4px 2px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      text-decoration: none;
      cursor: pointer;
    }

    .footer-link:hover {
      color: #6EE7B7;
      text-decoration: underline;
    }

    @media print {
      body {
        background: #FFFFFF !important;
      }
      .topbar,
      .site-footer,
      .top-triangle-row,
      .remedy-actions,
      .more-btn-wrap,
      .share-print-bar,
      .related-section,
      .doctor-find-btn,
      .modal-backdrop {
        display: none !important;
      }
      .remedy-card,
      .yellow-box,
      .red-header-banner,
      .red-info-card {
        box-shadow: none !important;
        break-inside: avoid;
      }
    }

    .select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .select-label-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .top-select {
      appearance: none;
      background: linear-gradient(180deg, #FFFFFF 0%, #F5FAF7 100%);
      border: 1px solid rgba(26, 122, 76, 0.22);
      border-radius: 999px;
      padding: 9px 34px 9px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      min-height: 40px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    .top-select:hover {
      border-color: var(--primary-green);
      background: var(--light-green-bg);
    }

    .select-chevron {
      position: absolute;
      right: 12px;
      pointer-events: none;
      color: var(--primary-green);
    }

    /* BREADCRUMB & HEADER */
    .page-header-wrap {
      background: linear-gradient(135deg, #1A7A4C 0%, #2BB673 56%, #00C9A7 100%);
      color: var(--pure-white);
      border-bottom: 1px solid rgba(255, 255, 255, 0.22);
      padding: 32px 0 36px;
      box-shadow: inset 0 -16px 32px rgba(15, 61, 38, 0.14);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: 14px;
    }

    .breadcrumb a {
      color: #FFFFFF;
      font-weight: 700;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .condition-title {
      font-size: clamp(1.9rem, 3.8vw, 2.7rem);
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.2;
      text-wrap: balance;
      text-shadow: 0 4px 14px rgba(15, 61, 38, 0.25);
      margin-bottom: 12px;
    }

    .for-pill {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #FFFFFF 0%, #E8F5EE 100%);
      color: #0F5132;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(15, 61, 38, 0.16);
    }

    .top-triangle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .top-triangle-btn {
      background: linear-gradient(180deg, #FFFFFF 0%, #F0FDF4 100%);
      color: #0F3D26;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      padding: 11px 22px;
      min-height: 44px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(15, 61, 38, 0.20);
      transition: transform 140ms ease, background 160ms ease, color 160ms ease;
    }

    .top-triangle-btn:hover {
      background: linear-gradient(135deg, #0F3D26, #1A7A4C);
      color: var(--pure-white);
      transform: translateY(-2px);
    }

    .top-triangle-btn:active {
      transform: translateY(2px);
    }

    /* YELLOW SUPPORTIVE BOX + 3D BORDER LEFT 6PX */
    .yellow-box {
      background: linear-gradient(135deg, #FFF8E1 0%, #FFF3CD 100%);
      border: 1px solid var(--warning-border);
      border-left: 6px solid #F59E0B;
      border-radius: var(--radius-card);
      padding: 20px 24px;
      box-shadow: var(--shadow-card);
      margin-top: 24px;
      color: var(--text-dark);
    }

    .yellow-box-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .yellow-box-text {
      font-size: 0.95rem;
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* MAIN CONTENT */
    .main-section {
      padding: 36px 0 48px;
    }

    .country-count-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .section-heading {
      font-size: clamp(1.35rem, 2.5vw, 1.8rem);
      font-weight: 800;
      color: var(--text-dark);
    }

    .count-indicator {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--primary-green);
      font-variant-numeric: tabular-nums;
    }

    .remedy-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 720px) {
      .remedy-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .remedy-card {
      background: linear-gradient(165deg, #FFFFFF 0%, #F9FCFA 100%);
      border: 1px solid rgba(26, 122, 76, 0.14);
      border-radius: var(--radius-card);
      padding: 22px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 200ms ease, border-color 200ms ease;
    }

    .remedy-card.highlighted {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(0, 201, 167, 0.32), var(--shadow-card);
    }

    .remedy-card:hover {
      transform: perspective(900px) rotateX(1.6deg) rotateY(-1.8deg) translateY(-4px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--vibrant-mint);
    }

    .remedy-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .remedy-country {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .remedy-country span:first-child {
      font-size: 1.45rem;
      display: inline-block;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.22));
    }

    .card-for-pill {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #E8F5EE 0%, #CCFBF1 100%);
      color: #0F5132;
      border: 1px solid rgba(26, 122, 76, 0.22);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.76rem;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(26, 122, 76, 0.10);
    }

    .remedy-ingredients {
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-dark);
      background-color: #F4FAF6;
      border: 1px solid rgba(26, 122, 76, 0.12);
      border-radius: 14px;
      padding: 13px 15px;
    }

    .remedy-tradition-note {
      font-size: 0.875rem;
      color: var(--text-grey);
    }

    .remedy-allergy {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--danger-red);
      background-color: var(--danger-bg);
      border-radius: 10px;
      padding: 8px 12px;
      line-height: 1.45;
    }

    .remedy-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding-top: 4px;
      flex-wrap: wrap;
    }

    .triangle-btn {
      flex: 1;
      min-width: 140px;
      background: linear-gradient(180deg, #FFFFFF 0%, #E8F5EE 100%);
      color: var(--primary-green);
      border: 1px solid rgba(26, 122, 76, 0.28);
      border-radius: 999px;
      padding: 10px 16px;
      min-height: 42px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(26, 122, 76, 0.10);
      transition: transform 140ms ease, background 160ms ease, color 160ms ease;
    }

    .triangle-btn:hover {
      background: linear-gradient(135deg, #1A7A4C, #2BB673);
      color: var(--pure-white);
      border-color: transparent;
      transform: translateY(-2px);
    }

    .triangle-btn:active {
      transform: translateY(2px);
    }

    .more-btn-wrap {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }

    .more-btn {
      background: linear-gradient(135deg, #1A7A4C, #2BB673, #00C9A7);
      color: var(--pure-white);
      border: none;
      border-radius: 999px;
      padding: 15px 32px;
      min-height: 52px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(26, 122, 76, 0.26);
      transition: transform 140ms ease, filter 160ms ease;
    }

    .more-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-3px);
    }

    .more-btn:active {
      transform: translateY(2px);
    }

    /* RED EMERGENCY TEMPLATE */
    .red-header-banner {
      background-color: var(--danger-bg);
      border: 1.5px solid var(--danger-border);
      border-radius: var(--radius-card);
      padding: 22px 24px;
      margin-bottom: 10px;
      color: var(--text-dark);
      box-shadow: var(--shadow-card);
    }

    .red-header-banner .condition-title {
      color: var(--danger-red);
      text-shadow: none;
    }

    .red-header-tag {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--danger-red);
      margin-bottom: 8px;
    }

    .red-info-card {
      background-color: var(--pure-white);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
    }

    .red-info-card h2 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .red-list {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--text-dark);
      font-size: 0.96rem;
    }

    .doctor-find-btn {
      background: linear-gradient(135deg, #DC2626, #991B1B);
      color: var(--pure-white);
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      min-height: 48px;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 8px 20px rgba(185, 28, 28, 0.25);
    }

    .doctor-find-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }

    .doctor-find-btn:active {
      transform: translateY(2px);
    }

    /* RELATED + BACK HOME */
    .related-section {
      background: rgba(255, 255, 255, 0.85);
      border-top: 1px solid var(--border-subtle);
      padding: 36px 0 44px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 16px;
      margin-bottom: 28px;
    }

    @media (min-width: 720px) {
      .related-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .related-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--pure-white);
      border: 1px solid rgba(26, 122, 76, 0.14);
      border-radius: var(--radius-card);
      padding: 18px;
      text-decoration: none;
      color: var(--text-dark);
      box-shadow: var(--shadow-card);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .related-card:hover {
      transform: perspective(900px) rotateX(1.5deg) rotateY(-1.5deg) translateY(-4px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--vibrant-mint);
    }

    .related-card-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--text-dark);
    }

    .related-card-sub {
      font-size: 0.85rem;
      color: var(--text-grey);
    }

    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #1A7A4C, #2BB673);
      color: var(--pure-white);
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      min-height: 44px;
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: var(--shadow-btn-3d);
    }

    .back-home-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }

    .back-home-btn:active {
      transform: translateY(2px);
    }

    /* FOOTER */
    .site-footer {
      background-color: var(--footer-dark);
      color: #FFFFFF;
      border-top: 3px solid #1A7A4C;
      padding: 34px 0;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-copy {
      font-size: 0.88rem;
      color: rgba(232, 245, 238, 0.85);
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;

          ? '<div class="yellow-box">' +
              '<div class="yellow-box-title">⚠️ Zaroori Supportive Jaankari (Doctor Ki Salah Zaroori)</div>' +
              '<p class="yellow-box-text">Ye supportive jaankari hai, dawa ka badal nahi hai. Doctor ko dikhayein. Koi bhi nuskha apnane se pehle apni dawaon aur report ke hisab se doctor se salah zaroor lein.</p>' +
            '</div>'
          : '';

        const safetyExtra = isYellow
          ? ' Ye supportive jaankari hai, dawa ka badal nahi hai. Doctor ko dikhayein.'
          : '';

        const related = getRelatedConditions(item);
        const relatedHtml = related.map(function (rel) {
          return (
            '<a class="related-card" href="condition.html?id=' + encodeURIComponent(rel.id) + '">' +
              '<span class="related-card-title">' + escapeHtml(rel.hindi) + ' — ' + escapeHtml(rel.english) + '</span>' +
              '<span class="related-card-sub">' + escapeHtml(rel.for) + '</span>' +
            '</a>'
          );
        }).join('');

        const canLoadMore = extraBatchesLoaded * 10 < NEXT_WORLD_BATCHES.length;
        const moreBtnText = canLoadMore
          ? 'More Dekhein - Agle 10 Desh'
          : 'Kam Dekhein - Sirf Pehle 10 Desh';

        pageRoot.innerHTML =
          '<section class="page-header-wrap">' +
            '<div class="container">' +
              '<nav class="breadcrumb" aria-label="Breadcrumb">' +
                '<a href="index.html">Home</a> <span aria-hidden="true">&gt;</span> ' +
                '<a href="index.html#categoriesHeading">' + escapeHtml(item.category) + '</a> <span aria-hidden="true">&gt;</span> ' +
                '<span>' + escapeHtml(item.hindi) + '</span>' +
              '</nav>' +
              '<h1 class="condition-title">' + escapeHtml(titleText) + '</h1>' +
              '<span class="for-pill">' + escapeHtml(forLine) + '</span>' +
              '<div class="top-triangle-row">' +
                '<button type="button" id="topAcupressureBtn" class="top-triangle-btn">👆 Iska Acupressure Point Dekho</button>' +
                '<button type="button" id="topMudraBtn" class="top-triangle-btn">🤌 Iski Hast Mudra Dekho</button>' +
              '</div>' +
              yellowTierBox +
            '</div>' +
          '</section>' +
          '<section class="main-section">' +
            '<div class="container">' +
              '<div class="country-count-bar">' +
                '<h2 class="section-heading">' + escapeHtml(item.hindi) + ' Me Duniya Kya Leti Hai?</h2>' +
                '<span class="count-indicator">' + combinedCountries.length + ' / 249 Desh</span>' +
              '</div>' +
              '<div class="remedy-grid">' + cardsHtml + '</div>' +
              '<div class="more-btn-wrap">' +
                '<button type="button" id="moreCountriesBtn" class="more-btn">' + moreBtnText + '</button>' +
              '</div>' +
              '<div class="yellow-box" style="margin-top: 36px;">' +
                '<div class="yellow-box-title">⚠️ Zaroori Savdhani</div>' +
                '<p class="yellow-box-text">Ye site parampara ki jaankari deti hai, dawa nahi bechti, ilaaj ka dawa nahi karti. Koi bhi nuskha apnane se pehle, agar aapko allergy hai, aap pregnant hai, ya bimari 2-3 din se zyada hai, to doctor se salah lein. Gambhir bimari jaise Heart Attack, Cancer, Stroke, TB, Pneumonia me koi gharelu nuskha nahi hai, turant doctor ke paas jayein.' + safetyExtra + '</p>' +
              '</div>' +
              '<div class="share-print-bar">' +
                '<button type="button" id="printPageBtn" class="print-btn">🖨️ Print Karo</button>' +
                '<a id="whatsappShareBtn" class="whatsapp-btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=' + encodeURIComponent(item.hindi + ' ke liye parampara me ' + (item.countries[0] ? item.countries[0].remedy : 'gharelu parampara') + ' ka use hota aaya hai - HomeRemediesWorld.com ' + window.location.href) + '">💬 WhatsApp Pe Bhejo</a>' +
              '</div>' +
            '</div>' +
          '</section>' +
          '<section class="related-section">' +
            '<div class="container">' +
              '<h2 class="section-heading">Related Conditions</h2>' +
              '<div class="related-grid">' + relatedHtml + '</div>' +
              '<a href="index.html" class="back-home-btn">← Back to Home</a>' +
            '</div>' +
          '</section>';

        document.getElementById('printPageBtn').addEventListener('click', function () {
          window.print();
        });
        document.getElementById('topAcupressureBtn').addEventListener('click', function () {
          window.location.href = 'acupressure.html?id=' + encodeURIComponent(item.id);
        });
        document.getElementById('topMudraBtn').addEventListener('click', function () {
          window.location.href = 'mudra.html?id=' + encodeURIComponent(item.id);
        });
        document.querySelectorAll('.card-acu-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            window.location.href = 'acupressure.html?id=' + encodeURIComponent(item.id);
          });
        });
        document.querySelectorAll('.card-mudra-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            window.location.href = 'mudra.html?id=' + encodeURIComponent(item.id);
          });
        });

        document.getElementById('moreCountriesBtn').addEventListener('click', function () {
          if (canLoadMore) {
            extraBatchesLoaded += 1;
          } else {
            extraBatchesLoaded = 0;
          }
          renderPage();
        });
      }

      function updatePageSeo(item) {
        const origin = (window.location.origin && window.location.origin !== 'null') ? window.location.origin : 'https://homeremediesworld.com';
        const canonicalUrl = origin + window.location.pathname + '?id=' + encodeURIComponent(item.id);
        const isRed = item.tier === 'RED';
        const titleStr = isRed
          ? item.hindi + ' (' + item.english + ') — Doctor Info | HomeRemediesWorld.com'
          : (currentLang === 'en'
            ? item.english + ' (' + item.hindi + ') Home Remedies — 10+ Countries | HomeRemediesWorld.com'
            : item.hindi + ' (' + item.english + ') Ke Gharelu Nuskhe — 10+ Desh | HomeRemediesWorld.com');
        const c0 = (item.countries && item.countries[0]) ? item.countries[0].remedy : 'paramparik dekhbhal';
        const descStr = isRed
          ? 'Gambhir sthiti: ' + item.hindi + ' (' + item.english + ') ke liye koi gharelu nuskha nahi hai. Turant doctor ke paas jayein.'
          : (currentLang === 'en'
            ? 'Traditional remedies for ' + item.english + ' (' + item.hindi + ') across 10+ countries including ' + c0 + ', plus acupressure and mudra links.'
            : item.hindi + ' (' + item.english + ') ke liye duniya ke 10+ deshon ki parampara jaise ' + c0 + ', acupressure aur hast mudra dekhein.');

        const canonEl = document.getElementById('canonicalTag');
        const descEl = document.getElementById('metaDescription');
        const ogTitleEl = document.getElementById('ogTitle');
        const ogDescEl = document.getElementById('ogDescription');
        const ogUrlEl = document.getElementById('ogUrl');
        const twTitleEl = document.getElementById('twitterTitle');
        const twDescEl = document.getElementById('twitterDescription');

        if (canonEl) canonEl.setAttribute('href', canonicalUrl);
        if (descEl) descEl.setAttribute('content', descStr);
        if (ogTitleEl) ogTitleEl.setAttribute('content', titleStr);
        if (ogDescEl) ogDescEl.setAttribute('content', descStr);
        if (ogUrlEl) ogUrlEl.setAttribute('content', canonicalUrl);
        if (twTitleEl) twTitleEl.setAttribute('content', titleStr);
        if (twDescEl) twDescEl.setAttribute('content', descStr);

        let ldEl = document.getElementById('conditionJsonLd');
        if (!ldEl) {
          ldEl = document.createElement('script');
          ldEl.id = 'conditionJsonLd';
          ldEl.type = 'application/ld+json';
          document.head.appendChild(ldEl);
        }
        ldEl.textContent = JSON.stringify({
          '@context': 'https://schema.org',
          '@type': 'WebPage',
          name: titleStr,
          description: descStr,
          url: canonicalUrl,
          about: { '@type': 'Thing', name: item.category }
        });
      }

      function renderPage() {
        if (!condition) {
          renderNotFound();
          return;
        }
        updatePageSeo(condition);
        if (condition.tier === 'RED') {
          renderRedPage(condition);
        } else {
          renderGreenOrYellowPage(condition);
        }
      }

      languageSelect.addEventListener('change', function () {
        const val = languageSelect.value;
        if (val === 'en' || val === 'hi') {
          currentLang = val;
          renderPage();
        } else {
          const selectedLabel = languageSelect.options[languageSelect.selectedIndex].text;
          showModal(selectedLabel + ' bhasha ka poora anuvaad aage ke phase me aayega. Abhi Hindi aur English chalu hai.', 'Language Selector');
        }
      });

      countrySelect.addEventListener('change', function () {
        currentCountryFilter = countrySelect.value;
        renderPage();
        if (currentCountryFilter) {
          const card = document.querySelector('.remedy-card[data-country="' + currentCountryFilter + '"]');
          if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      });

      const FOOTER_INFO = {
        Disclaimer: 'Ye site keval paramparik jaankari ke liye hai. Ye site dawa nahi bechti, ilaaj ka dawa nahi karti.',
        Privacy: 'Aapka koi bhi personal data server par save nahi hota hai.',
        Contact: 'Sampark ke liye: info@homeremediesworld.com'
      };
      document.querySelectorAll('button.footer-link[data-footer]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const key = btn.getAttribute('data-footer');
          showModal(FOOTER_INFO[key], key);
          if (key === 'Disclaimer' || key === 'Privacy') {
            modalBody.appendChild(document.createElement('br'));
            modalBody.appendChild(document.createElement('br'));
            modalBody.appendChild(document.createTextNode('Koi shikayat ya galat jaankari lage to humein batayein: '));
            const mailLink = document.createElement('a');
            mailLink.href = 'mailto:info@homeremediesworld.com';
            mailLink.textContent = 'info@homeremediesworld.com';
            mailLink.style.color = '#1A7A4C';
            mailLink.style.fontWeight = '700';
            modalBody.appendChild(mailLink);
          }
        });
      });

      renderPage();
      console.log('PHASE 4 COMPLETE - SITE READY');
    })();
  </script>
</body>
</html>
