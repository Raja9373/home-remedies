    <path d="M 314 544
             C 428 508, 574 446, 694 356
             C 618 456, 496 524, 336 554
             C 326 554, 318 550, 314 544 Z"
          fill="#157A46" />

    <!-- Subtle flat fresh highlight along upper leaf curve -->
    <path d="M 346 450
             C 418 394, 514 372, 622 364
             C 520 388, 432 418, 346 450 Z"
          fill="#5CE098" opacity="0.55" />

    <!-- Healing Hand in warm skin tone (centered & cradling underneath) -->
    <path d="M 108 756
             L 250 618
             C 302 568, 366 544, 438 552
             L 570 568
             C 604 572, 624 596, 620 622
             C 616 648, 590 666, 556 664
