             C 684 800, 610 834, 518 834
             L 354 828
             C 304 826, 264 838, 226 870
             L 164 924 Z"
          fill="#F2B88D" />

    <!-- Warm flat shading fold along lower palm & thumb crease -->
    <path d="M 420 670
             C 432 682, 456 684, 492 684
             L 606 680
             C 660 676, 704 642, 752 578
             C 770 552, 792 546, 810 552
             C 782 568, 756 602, 718 654
             C 670 718, 618 744, 540 744
             L 402 738
             C 360 736, 330 720, 310 700
             C 342 712, 384 714, 426 708
             C 400 700, 396 676, 420 670 Z"
          fill="#DE996B" opacity="0.72" />

    <!-- Crisp Four-Point Golden Sparkle above leaf (bold enough for 16x16) -->
