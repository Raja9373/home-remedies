<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="emblemClip">
      <circle cx="512" cy="512" r="458" />
    </clipPath>
  </defs>

  <!-- Soft round circle background in deep royal blue #0A1633 -->
  <circle cx="512" cy="512" r="476" fill="#0A1633" />

  <!-- Clipped emblem interior -->
